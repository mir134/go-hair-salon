# ============================================================
# 理发店客户管理系统 — 服务端配置示例
# ------------------------------------------------------------
# 使用方法：复制为同目录的 config.yaml 后按实际情况修改：
#     cp config.example.yaml config.yaml
# 注意：config.yaml 含 JWT 密钥与管理员初始密码，已被 .gitignore 忽略，
#       禁止提交到仓库；仓库中只保留本示例文件。
# 所有配置项均可被“同名环境变量”覆盖（如 DB_PATH、SERVER_PORT、JWT_SECRET）。
# ============================================================

# SQLite 数据库文件路径（必填）。
# 硬规则：必须位于本机本地磁盘，禁止使用 SMB/NFS/NAS 等网络共享目录（UNC 路径会被拒绝）。
DB_PATH: data/hair-salon.db

# 上传文件存放目录（必填）
UPLOAD_DIR: data/uploads

# 备份文件存放目录（必填）
BACKUP_DIR: data/backups

# 日志文件存放目录（必填）
LOG_DIR: logs

# HTTP 监听地址（可选，默认 0.0.0.0）：0.0.0.0 允许同一局域网内的电脑与手机访问
SERVER_HOST: 0.0.0.0

# HTTP 监听端口（可选，默认 8080）
SERVER_PORT: 8080

# JWT 签名密钥（必填，禁止为空）。
# 请填写足够长的随机字符串，不要提交到仓库；留空时服务端启动会直接报错退出。
JWT_SECRET: ""

# 首次启动时创建的 admin 账号初始密码（可选，默认 admin123）；首次登录后请立即修改
INITIAL_ADMIN_PASSWORD: admin123

# 每日自动备份时间，24 小时制 HH:MM（可选，默认 23:00）
BACKUP_TIME: "23:00"
